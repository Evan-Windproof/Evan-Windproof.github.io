name: Build and deploy technology blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-blog.txt
      - run: python scripts/build_blog.py
      - uses: actions/configure-pages@v5
      - name: Prepare static artifact
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='.git' --exclude='.github' --exclude='work' --exclude='tests' --exclude='scripts' --exclude='content' ./ /tmp/site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
