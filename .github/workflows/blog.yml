name: Build and deploy technology blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-blog.txt
      - run: python scripts/build_blog.py
      - uses: actions/configure-pages@v5
      - name: Prepare static artifact
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='.git' --exclude='.github' --exclude='work' --exclude='tests' --exclude='scripts' --exclude='content' ./ /tmp/site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Existing branch-based Pages may still run. Publish the newly generated
      # artifact last so a legacy build cannot overwrite new Markdown content.
      - name: Wait for any legacy Pages build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$pending" = "0" ]; then exit 0; fi
            sleep 5
          done
          echo 'Legacy Pages build did not finish within five minutes'
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
