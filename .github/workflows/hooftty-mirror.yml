name: Sync HoofTTY website mirror

on:
  push:
    branches: [main]
    paths:
      - 'projects/hooftty/**'
      - 'scripts/sync_hooftty.sh'
      - '.github/workflows/hooftty-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hooftty-website-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check mirror credential configuration
        id: credential
        env:
          MIRROR_TOKEN: ${{ secrets.HOOFTTY_MIRROR_TOKEN }}
        run: |
          if [[ -n "$MIRROR_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Set the HOOFTTY_MIRROR_TOKEN repository secret to enable synchronization."
          fi
      - uses: actions/checkout@v4
        if: steps.credential.outputs.enabled == 'true'
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
          path: site
      - uses: actions/checkout@v4
        if: steps.credential.outputs.enabled == 'true'
        with:
          repository: Evan-Windproof/HoofTTY-Website
          ref: main
          token: ${{ secrets.HOOFTTY_MIRROR_TOKEN }}
          path: mirror
      - name: Sync page and push changed files
        if: steps.credential.outputs.enabled == 'true'
        run: |
          bash site/scripts/sync_hooftty.sh site mirror
          if git -C mirror diff --cached --quiet; then exit 0; fi
          source=$(git -C site rev-parse --short HEAD)
          git -C mirror -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Sync HoofTTY page from ${source}"
          git -C mirror push origin HEAD:refs/heads/main
